name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:

permissions:
  contents: read

jobs:
  build-test-matrix:
    name: build-test (${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm audit --omit=dev --audit-level=high

  build-test:
    needs: [build-test-matrix]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Require Node matrix to pass
        run: |
          if [ "${{ needs.build-test-matrix.result }}" != "success" ]; then
            echo "build-test matrix result: ${{ needs.build-test-matrix.result }}"
            exit 1
          fi

  docs-drift-dispatch:
    needs: [build-test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Get changed files
        id: changed
        run: |
          BEFORE="${{ github.event.before }}"
          AFTER="${{ github.sha }}"

          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            BEFORE=$(git rev-list --max-parents=0 "$AFTER")
          fi

          FILES=$(git diff --name-only "$BEFORE" "$AFTER" | jq -R -s -c 'split("\n") | map(select(. != ""))')
          echo "Changed files: $FILES"
          echo "files=$FILES" >> "$GITHUB_OUTPUT"

      - name: Verify docs drift app credentials
        env:
          DOCS_DRIFT_APP_ID: ${{ secrets.DOCS_DRIFT_APP_ID }}
          DOCS_DRIFT_APP_PRIVATE_KEY: ${{ secrets.DOCS_DRIFT_APP_PRIVATE_KEY }}
        run: |
          if [ -z "$DOCS_DRIFT_APP_ID" ] || [ -z "$DOCS_DRIFT_APP_PRIVATE_KEY" ]; then
            echo "::error::DOCS_DRIFT_APP_ID and DOCS_DRIFT_APP_PRIVATE_KEY are required to dispatch autovault-website docs drift."
            exit 1
          fi

      - name: Create docs drift app token
        id: docs_token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.DOCS_DRIFT_APP_ID }}
          private-key: ${{ secrets.DOCS_DRIFT_APP_PRIVATE_KEY }}
          owner: autoworks-ai
          repositories: autovault-website
          permission-contents: write

      - name: Check website file-doc mapping
        id: check
        env:
          CHANGED_FILES: ${{ steps.changed.outputs.files }}
          GH_TOKEN: ${{ steps.docs_token.outputs.token }}
        run: |
          echo "Changed files payload: $CHANGED_FILES"

          AUTH_HEADER=()
          if [ -n "${GH_TOKEN:-}" ]; then
            AUTH_HEADER=(-H "Authorization: Bearer $GH_TOKEN")
          fi

          if ! MAP=$(curl -sf --connect-timeout 10 --max-time 30 --retry 2 --retry-connrefused \
            "${AUTH_HEADER[@]}" \
            "https://raw.githubusercontent.com/autoworks-ai/autovault-website/main/scripts/file-doc-map.json"); then
            echo "::warning::Failed to fetch file-doc-map.json, dispatching docs audit anyway"
            echo "affected=unknown" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          AFFECTED=$(echo "$MAP" | jq -r --arg repo "${{ github.event.repository.name }}" --argjson changed "$CHANGED_FILES" '
            def matches_pattern($file; $pattern):
              if ($pattern | endswith("/**")) then
                ($file | startswith($pattern[0:-2]))
              else
                $file == $pattern
              end;

            .[$repo] // {} | to_entries | map(
              select(.key as $pattern | $changed | any(. as $file | matches_pattern($file; $pattern)))
            ) | map(.value) | flatten | unique | .[]
          ')

          if [ -z "$AFFECTED" ]; then
            echo "No website docs pages affected by this push"
            echo "affected=none" >> "$GITHUB_OUTPUT"
          else
            AFFECTED_JSON=$(echo "$AFFECTED" | jq -R -s -c 'split("\n") | map(select(. != ""))')
            echo "Affected website pages: $AFFECTED_JSON"
            echo "affected=$AFFECTED_JSON" >> "$GITHUB_OUTPUT"
          fi

      - name: Dispatch docs drift workflow
        if: steps.check.outputs.affected != 'none'
        env:
          GH_TOKEN: ${{ steps.docs_token.outputs.token }}
        run: |
          PAYLOAD="$RUNNER_TEMP/docs-drift-payload.json"
          jq -n \
            --arg event_type "docs-drift" \
            --arg source_repo "${{ github.event.repository.full_name }}" \
            --arg source_sha "${{ github.sha }}" \
            --arg source_branch "${{ github.ref_name }}" \
            --arg changed_files '${{ steps.changed.outputs.files }}' \
            --arg affected_docs '${{ steps.check.outputs.affected }}' \
            --arg compare_url "${{ github.event.compare }}" \
            --arg reason "CI passed for ${{ github.sha }} on ${{ github.ref_name }}" \
            '{
              event_type: $event_type,
              client_payload: {
                source_repo: $source_repo,
                source_sha: $source_sha,
                source_branch: $source_branch,
                changed_files: ($changed_files | fromjson),
                affected_docs: (try ($affected_docs | fromjson) catch $affected_docs),
                compare_url: $compare_url,
                reason: $reason
              }
            }' > "$PAYLOAD"

          echo "Dispatch payload:"
          jq . "$PAYLOAD"

          gh api repos/autoworks-ai/autovault-website/dispatches --input "$PAYLOAD"
          echo "Docs drift dispatch accepted for ${{ github.sha }}"
